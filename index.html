<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Bienvenue Chef ! — ChefGestion Pro</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000000; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { width: 90%; max-width: 500px; background-color: #141414; border-radius: 12px; overflow: hidden; border: 1px solid #2a2a2a; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .header { background: linear-gradient(135deg, #1a1a1a 0%, #0d0d0d 100%); padding: 40px 30px; border-bottom: 1px solid #2a2a2a; }
        .logo { width: 90px; border-radius: 14px; margin-bottom: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .brand { margin-bottom: 12px; }
        .brand-gold { font-size: 11px; letter-spacing: 4px; color: #c9a84c; text-transform: uppercase; font-weight: 600; }
        .brand-white { font-size: 11px; letter-spacing: 4px; color: #ffffff; text-transform: uppercase; font-weight: 600; }
        h1 { margin: 0; font-size: 22px; color: #ffffff; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }
        .content { padding: 40px 40px; }
        p { color: #888888; font-size: 15px; line-height: 1.7; margin: 0 0 32px; }
        
        /* Badge de statut non-interactif */
        .status-badge {
            display: inline-block;
            border: 1px solid #c9a84c;
            color: #c9a84c;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 32px;
            border-radius: 4px;
            background: rgba(201, 168, 76, 0.05);
        }

        .footer { background-color: #0d0d0d; padding: 24px 30px; border-top: 1px solid #2a2a2a; }
        .footer-text { margin: 0; color: #444444; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="https://osnckjlgqqawcgduideb.supabase.co/storage/v1/object/public/assets/logo.png" alt="Logo" class="logo">
            <div class="brand">
                <span class="brand-gold">✦ Chef </span>
                <span class="brand-white">Gestion</span>
                <span class="brand-gold"> Pro ✦</span>
            </div>
            <h1>Accès validé</h1>
        </div>
        <div class="content">
            <p>
                Votre adresse email a été confirmée avec succès.<br>
                Vous pouvez maintenant fermer cette page.
            </p>
            <div class="status-badge">
                ✦ Retournez dans l'application ✦
            </div>
        </div>
        <div class="footer">
            <p class="footer-text">
            <p style="margin:0 0 8px; color:#444444; font-size:12px; letter-spacing:1px;">
                © 2025 ChefGestion Pro — Tous droits réservés
              </p>
              <p style="margin:0; color:#333333; font-size:11px;">
                Cet email a été envoyé automatiquement, merci de ne pas y répondre.
        </div>
    </div>
</body>
</html>
